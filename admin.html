<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://hdegaqyvolsqgydwuyau.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Painel · Rumo à Posse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Painel: barra superior, abas por tipo de conteúdo, lista à esquerda e editor à direita (empilha no celular). */
:root{
  --ink:#13223d; --paper:#f6f7f9; --card:#fff; --line:#dde2ea; --muted:#5b6778;
  --marker:#ffd93b; --marker-ink:#13223d; --accent:#1f5fd1; --ok:#1d8a52; --danger:#c0362c;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--ink:#e8edf6;--paper:#0e1626;--card:#16213a;--line:#26324d;--muted:#9aa7bd;--accent:#7fb0ff;--ok:#4cc488;--danger:#ff7a6e;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;border-radius:9px;padding:9px 16px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none}
.btn.marker{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.hidden{display:none!important}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;display:grid;gap:14px}
.mark{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--marker);color:var(--marker-ink);font-weight:800}

/* Campos */
label.f{display:grid;gap:5px;font-weight:600;font-size:.9rem}
.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=date],input[type=number],select,textarea{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
.check input{width:20px;height:20px}
.msg{min-height:1.3em;margin:0;font-weight:600;font-size:.92rem}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

/* App */
header.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header.bar .in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.bar .who{margin-left:auto;color:var(--muted);font-size:.88rem}
.tabs{display:flex;gap:4px;max-width:1240px;margin:0 auto;padding:0 20px;overflow-x:auto}
.tabs button{font:inherit;font-weight:700;background:none;border:none;border-bottom:3px solid transparent;padding:10px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--marker)}
main{max-width:1240px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--paper);text-align:left;font:inherit;color:inherit;width:100%}
.item:hover{border-color:var(--ink)}
.item[aria-current=true]{border:2px solid var(--ink)}
.item strong{font-size:.95rem}
.item .sub{grid-column:1/-1;color:var(--muted);font-size:.82rem}
.pill{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;align-self:start;white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.off{background:var(--line);color:var(--muted)}
.pill.warn{background:color-mix(in srgb,var(--marker) 55%,transparent);color:var(--marker-ink)}
.pill.err{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
details>summary{min-height:28px}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* Editor de texto */
.rt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.rt .tb{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0}
.rt .tb button{font:inherit;font-size:.85rem;font-weight:700;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.rt .ed{min-height:320px;padding:14px 16px;outline:none;font-size:1.02rem;line-height:1.65}
.rt .ed:empty::before{content:"Escreva o artigo aqui. Use Subtítulo para separar as partes.";color:var(--muted)}
.rt .ed h2{font-size:1.3rem;margin:18px 0 6px}
.rt .ed blockquote{margin:12px 0;padding:10px 14px;border-left:5px solid var(--marker);background:var(--card)}
.rt .ed p{margin:0 0 10px}
/* Imagens */
.img-field .lbl{font-weight:600;font-size:.9rem}
.img-box{border:1px dashed var(--line);border-radius:10px;background:var(--paper);aspect-ratio:16/9;max-height:240px;display:grid;place-items:center;overflow:hidden}
.img-box img{width:100%;height:100%;object-fit:cover}
.img-box .ph{color:var(--muted);font-size:.9rem}
.img-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.small{padding:7px 12px;font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.rt .ed img{max-width:100%;height:auto;border-radius:8px;display:block;margin:8px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}

/* Figuras/desenhos no editor: mesmo cartão claro do site */
.rt .ed figure{margin:16px 0;text-align:center;background:#ffffff;color:#1f2937;border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.rt .ed figure svg{display:block;max-width:100%;height:auto;margin:0 auto}
.rt .ed figcaption{font-size:14px;color:#6b7280;margin-top:8px}
</style>
</head>
<body>

<!-- Aviso de configuração -->
<div id="sem-config" class="login hidden">
  <div class="panel" style="max-width:460px">
    <h2>Falta ligar o painel ao Supabase</h2>
    <p>Abra o arquivo <strong>config.js</strong> e cole a URL do projeto e a chave pública do Supabase. Depois recarregue esta página.</p>
  </div>
</div>

<!-- Login -->
<div id="tela-login" class="login hidden">
  <form id="form-login">
    <div style="display:flex;gap:10px;align-items:center"><span class="mark">↗</span><h2>Painel do autor</h2></div>
    <label class="f" for="l-email">E-mail<input id="l-email" type="email" autocomplete="username" required></label>
    <label class="f" for="l-senha">Senha<input id="l-senha" type="password" autocomplete="current-password" required></label>
    <button class="btn marker" type="submit" id="btn-entrar">Entrar</button>
    <p class="msg" id="login-msg" aria-live="polite"></p>
    <a href="index.html" style="font-size:.9rem">← Voltar para o site</a>
  </form>
</div>

<!-- Painel -->
<div id="tela-app" class="hidden">
  <header class="bar">
    <div class="in">
      <span class="mark">↗</span><h3>Painel · Rumo à Posse</h3>
      <span class="who" id="who"></span>
      <a class="btn ghost" href="index.html" target="_blank" rel="noopener">Ver site</a>
      <button class="btn ghost" id="btn-sair">Sair</button>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="artigos" aria-selected="true">Artigos</button>
      <button role="tab" data-tab="concursos" aria-selected="false">Concursos</button>
      <button role="tab" data-tab="editais" aria-selected="false">Editais → planos</button>
      <button role="tab" data-tab="produtos" aria-selected="false">Materiais</button>
      <button role="tab" data-tab="inscritos" aria-selected="false">Newsletter</button>
      <button role="tab" data-tab="config" aria-selected="false">Configurações</button>
    </div>
  </header>
  <main>
    <section class="panel" id="lista-panel">
      <div class="panel-head"><h3 id="lista-titulo">Artigos</h3><button class="btn marker" id="btn-novo">+ Novo</button></div>
      <div class="list" id="lista"></div>
    </section>
    <section class="panel" id="editor"></section>
  </main>
</div>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
